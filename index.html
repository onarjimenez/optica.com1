  const t=await r.text();if(!r.ok)throw new Error(r.status+' '+t);return t?JSON.parse(t):null}

async function save(){

    const ids=D[t].map(r=>r.id);
    await sb('DELETE',t+'?id='+(ids.length?'not.in.('+ids.join(',')+')':'gt.0'));
    if(D[t].length)await sb('POST',t,D[t].map(r=>{const o={...r};for(const k in o)if(o[k]==='')o[k]=null;return o}),'resolution=merge-duplicates,return=minimal');
  }
  D0=JSON.parse(JSON.stringify(D))}

async function doRegistro(e){
  e.preventDefault();const f=new FormData(e.target),correo=f.get('correo').trim().toLowerCase();
  if(f.get('clave')!==f.get('clave2'))return vRegistro('Las contraseñas no coinciden.');
  try{await cargar();await sembrar();
    if(D.usuarios.some(x=>x.correo.toLowerCase()===correo))return vRegistro('Ya existe una cuenta con ese correo.');
    D.usuarios.push({id:nid('usuarios'),nombre:f.get('nombre').trim(),correo,rol:'usuario',clave:await sha(f.get('clave'))});
    await save();vLogin('','Cuenta creada. Inicia sesión eligiendo el rol Usuario.');
  }catch(x){vRegistro('Error Supabase: '+x.message)}}
async function doLogin(e){
  e.preventDefault();const f=new FormData(e.target);
  try{await cargar();await sembrar();
    const hs=await sha(f.get('clave'));
    const x=D.usuarios.find(x=>x.correo.toLowerCase()===f.get('correo').trim().toLowerCase()&&x.rol===f.get('rol')&&x.clave===hs);
    if(!x)return vLogin('Correo, contraseña o rol incorrectos.');
    U={id:x.id,nombre:x.nombre,rol:x.rol};sessionStorage.setItem('u',JSON.stringify(U));location.hash='#dashboard';render();
  }catch(x){vLogin('Error Supabase: '+x.message)}}
function salir(){sessionStorage.removeItem('u');U=null;location.hash='';render()}

// ---------- Acciones ----------
async function run(fn){let t;try{t=await fn()}catch(x){msg='⚠ '+x.message}if(t)history.replaceState(null,'',t);render()}
function enviar(e,fn,a){e.preventDefault();const fd=new FormData(e.target);run(()=>fn(fd,a))}
async function guardar(fd,m){
  const r={};for(const f of S[m].f){const v=(fd.get(f[0])||'').trim();r[f[0]]=f[2]==='number'?(parseFloat(v)||0):v}
  const i=D[m].findIndex(x=>x.id==fd.get('id'));
  if(m==='usuarios')r.clave=r.clave?await sha(r.clave):(i>=0?D[m][i].clave:'');
  if(i>=0)D[m][i]={...D[m][i],...r};else{r.id=nid(m);if(m==='clientes')r.fecha_registro=hoy();D[m].push(r)}
  await save();msg='Registro guardado correctamente.';return '#'+m}
function borrar(m,id){if(!confirm('¿Eliminar este registro?'))return;run(async()=>{
  if(m==='usuarios'&&id==U.id){msg='⚠ No puedes eliminar tu propio usuario.';return}
  D[m]=D[m].filter(x=>x.id!=id);await save();msg='Registro eliminado.'})}
async function movimiento(fd){
  const p=D.productos.find(x=>x.id==fd.get('producto_id')),c=parseInt(fd.get('cantidad')),t=fd.get('tipo');
  if(!p||!(c>=0))throw new Error('Datos del movimiento no válidos.');
  if(t==='Salida'&&c>p.stock)throw new Error('La salida supera las existencias.');
  p.stock=t==='Entrada'?p.stock+c:t==='Salida'?p.stock-c:c;
  mov(p.id,t,c,(fd.get('nota')||'').trim());await save();msg='Movimiento registrado.'}
async function vender(fd){
  const L=[];let tot=0;const ps=fd.getAll('p'),qs=fd.getAll('q');
  for(let k=0;k<ps.length;k++){const pr=D.productos.find(x=>x.id==ps[k]),q=parseInt(qs[k])||0;if(!pr||q<1)continue;
    if(pr.stock<q)throw new Error('Existencias insuficientes de '+pr.codigo);L.push({pid:pr.id,q,pu:pr.precio});tot+=q*pr.precio}
  const serv=parseFloat(fd.get('servicios'))||0;tot+=serv;const cid=parseInt(fd.get('cliente_id'));
  if(!D.clientes.find(c=>c.id==cid))throw new Error('Selecciona un cliente.');
  if(!L.length)throw new Error('Agrega al menos un producto.');
  const vid=nid('ventas');
  L.forEach(l=>{D.productos.find(x=>x.id==l.pid).stock-=l.q;mov(l.pid,'Salida',l.q,'Venta #'+vid)});
  D.ventas.push({id:vid,fecha:ahora(),cliente_id:cid,items:L,servicios:serv,total:tot,pago:fd.get('pago'),usuario:U.nombre});
  if(fd.get('crear_orden'))D.ordenes.push({id:nid('ordenes'),venta_id:vid,cliente_id:cid,estado:ESTADOS[0],seg:[[ESTADOS[0],ahora(),U.nombre]]});
  await save();msg='Venta #'+vid+' registrada por '+money(tot)+'.'}
const ucorreo=()=>(D.usuarios.find(x=>x.id==U.id)||{}).correo||'';
async function comprar(fd){
  const pr=D.productos.find(x=>x.id==fd.get('producto_id')),q=parseInt(fd.get('cantidad'))||0;
  if(!pr||q<1)throw new Error('Elige un producto y una cantidad válida.');
  if(pr.stock<q)throw new Error('Solo quedan '+pr.stock+' unidades de '+pr.codigo+'.');
  const cu=ucorreo();let cl=D.clientes.find(c=>(c.correo||'').toLowerCase()===cu.toLowerCase());
  if(!cl){cl={id:nid('clientes'),documento:'',nombre:U.nombre,fecha_nac:'',telefono:'',correo:cu,direccion:'',observaciones:'',fecha_registro:hoy()};D.clientes.push(cl)}
  const vid=nid('ventas'),tot=q*pr.precio;pr.stock-=q;mov(pr.id,'Salida',q,'Compra #'+vid);
  D.ventas.push({id:vid,fecha:ahora(),cliente_id:cl.id,items:[{pid:pr.id,q,pu:pr.precio}],servicios:0,total:tot,pago:fd.get('pago'),usuario:U.nombre});
  await save();msg='Compra #'+vid+' realizada por '+money(tot)+'.';return '#comprar'}
function avanzar(id){run(async()=>{const o=D.ordenes.find(x=>x.id==id),k=ESTADOS.indexOf(o.estado);

  const filas=D[m].filter(r=>!q||JSON.stringify(r).toLowerCase().includes(q.toLowerCase())).map(r=>`<tr>${e.cols.map(c=>{let v=r[c]??'';

function vOrd(){
  return `<h2>Órdenes de lentes</h2><table><tr><th>#</th><th>Venta</th><th>Cliente</th><th>Estado</th><th>Seguimiento</th><th></th></tr>${[...D.ordenes].reverse().map(o=>`<tr><td>${o.id}</td><td>#${o.venta_id}</td><td>${h(nom('clientes',o.cliente_id))}</td><td><span class="b ${o.estado==='Entregada'?'verde':'azul'}">${o.estado}</span></td>
  <td><details><summary>Ver</summary>${o.seg.map(s=>`<small>${h(s[1]+' · '+s[0]+' · '+s[2])}</small><br>`).join('')}</details></td><td>${o.estado!=='Entregada'?`<button onclick="avanzar(${o.id})">Avanzar →</button>`:''}</td></tr>`).join('')}</table>`}
async function render(){
  if(!U)return vLogin();
  document.body.className='';
  try{await cargar()}catch(x){$('#app').innerHTML='<pre>Error Supabase: '+h(x.message)+'</pre>';return}
  const[hm,qs]=(location.hash||'#dashboard').slice(1).split('?');let m=hm;if(!PERM[U.rol].includes(m))m=PERM[U.rol][0];
  const body=S[m]?vCrud(m,new URLSearchParams(qs||'')):({dashboard:vDash,inventario:vInv,ventas:vVentas,ordenes:vOrd,comprar:vComprar})[m](new URLSearchParams(qs||''));
  $('#app').innerHTML=`<header><b>👓 Óptica</b><nav>${Object.keys(NAV).filter(k=>PERM[U.rol].includes(k)).map(k=>`<a href="#${k}" class="${k===m?'on':''}">${NAV[k]}</a>`).join('')}</nav><span>${h(U.nombre)} (${h(U.rol)}) · <a href="#" onclick="salir()">Salir</a></span></header><main>${msg?`<div class="msg">${h(msg)}</div>`:''}${body}</main>`;msg=''}
window.onhashchange=render;render();
</script></body></html>
